<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08131d">
<meta name="description" content="The Wedge, Newport Beach live surf and weather information banner.">
<title>The Wedge Cam · Newport Beach</title>
<style>
:root{color-scheme:dark;--ink:#f5f8fa;--muted:#9eafbc;--line:rgba(222,237,247,.13);--accent:#ffb65c}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.page{width:100%;margin:0;padding:0}
.banner{width:100%;display:grid;grid-template-columns:82px 142px minmax(190px,1.7fr) repeat(4,minmax(84px,.72fr)) minmax(110px,.9fr) minmax(118px,1fr);align-items:stretch;overflow:hidden;background:linear-gradient(115deg,rgba(7,20,31,.97),rgba(9,31,43,.94) 55%,rgba(5,16,25,.98));border:1px solid rgba(203,225,239,.18);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.24);position:relative}
.banner:before{content:"";height:2px;position:absolute;top:0;left:82px;right:0;background:linear-gradient(90deg,#56b5ff,#927cff,#f45b82,#ffb45e)}
.cell{min-width:0;min-height:108px;padding:14px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-right:1px solid var(--line)}
.cell:last-child{border-right:0}
.label{font-size:9px;line-height:1.2;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:#aebdca;white-space:nowrap}
.value{font-size:clamp(18px,1.65vw,27px);font-weight:680;line-height:1.05;letter-spacing:-.035em;margin:8px 0 5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sub{font-size:9px;line-height:1.25;font-weight:650;letter-spacing:.045em;color:#c0cdd6;white-space:nowrap}
.brand{gap:7px}
.logo{width:43px;height:43px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:linear-gradient(180deg,#f5a14a 0 35%,#147f9b 36% 66%,#0a2233 67%);font-size:23px}
.brandname{font-size:10px;letter-spacing:.13em;font-weight:800;white-space:nowrap}
.time .value{font-size:clamp(19px,1.7vw,27px);letter-spacing:-.025em}
.location{align-items:flex-start;text-align:left;padding-left:18px}
.location .value{font-size:clamp(24px,2.45vw,39px);font-weight:760;letter-spacing:-.055em;margin:6px 0 5px}
.location .sub{font-size:8px;letter-spacing:.08em}
.weathericon{font-size:22px;line-height:1.1;margin:7px 0 5px}
.quality{padding-left:12px;padding-right:12px}
.qualitybar{width:100%;height:7px;border-radius:20px;margin:12px 0 8px;background:linear-gradient(90deg,#3bd56c 0 34%,#f5d64b 34% 67%,#f54c65 67%);box-shadow:0 0 12px rgba(255,255,255,.07)}
.youtube{display:inline-grid;place-items:center;width:25px;height:18px;border-radius:5px;background:#f04455;font-size:11px;margin-right:5px;vertical-align:2px}
.status{position:absolute;left:-10000px}
@media(max-width:1100px){.banner{grid-template-columns:70px 120px minmax(175px,1.5fr) repeat(4,minmax(75px,.7fr)) minmax(95px,.8fr) minmax(100px,.9fr)}.cell{padding:12px 7px;min-height:96px}.location{padding-left:12px}.location .value{font-size:clamp(21px,2.5vw,31px)}.sub{font-size:8px}.label{font-size:8px}}
@media(max-width:760px){.banner{grid-template-columns:70px 1fr 1fr 1fr 1fr;border-radius:9px}.cell{min-height:82px;padding:10px 5px}.brand{grid-column:1;grid-row:1}.time{grid-column:2;grid-row:1}.location{grid-column:3 / 6;grid-row:1;align-items:flex-start}.location .value{font-size:clamp(23px,4vw,32px)}.cell:nth-child(4){grid-column:1;grid-row:2}.cell:nth-child(5){grid-column:2;grid-row:2}.cell:nth-child(6){grid-column:3;grid-row:2}.cell:nth-child(7){grid-column:4;grid-row:2}.cell:nth-child(8){grid-column:5;grid-row:2}.cell:nth-child(9){grid-column:1 / 3;grid-row:3}.cell:nth-child(10){grid-column:3 / 6;grid-row:3}.cell:nth-child(11){display:none}.banner:before{left:70px}}
@media(max-width:480px){.banner{grid-template-columns:repeat(4,minmax(0,1fr))}.brand{grid-column:1;grid-row:1}.time{grid-column:2 / 5;grid-row:1}.location{grid-column:1 / 5;grid-row:2;align-items:center;text-align:center;border-top:1px solid var(--line)}.location .value{font-size:30px}.location .sub{font-size:8px}.cell:nth-child(4){grid-column:1;grid-row:3}.cell:nth-child(5){grid-column:2;grid-row:3}.cell:nth-child(6){grid-column:3;grid-row:3}.cell:nth-child(7){grid-column:4;grid-row:3}.cell:nth-child(8){grid-column:1 / 3;grid-row:4}.cell:nth-child(9){grid-column:3 / 5;grid-row:4}.cell:nth-child(10){grid-column:1 / 5;grid-row:5}.cell{min-height:76px}.value{font-size:20px}.label{font-size:8px}.sub{font-size:8px}.brandname{font-size:9px}.logo{width:37px;height:37px}.time .value{font-size:23px}}
</style>
</head>
<body>
<main class="page">
<section class="banner" aria-label="The Wedge live surf information banner">
<div class="cell brand"><div class="logo" aria-hidden="true">🌊</div><div class="brandname">WEDGE CAM</div></div>
<div class="cell time"><div class="label">Newport local time</div><div class="value" id="clock">--:--:--</div><div class="sub" id="date">CALIFORNIA</div></div>
<div class="cell location"><div class="label">Newport Beach · California</div><div class="value">THE WEDGE</div><div class="sub">NEWPORT BEACH</div></div>
<div class="cell"><div class="label">Air temp</div><div class="value" id="temperature">—</div><div class="sub" id="temperatureC">°C</div></div>
<div class="cell"><div class="label">Buoy waves</div><div class="value" id="waveHeight">—</div><div class="sub" id="wavePeriod">NOAA BUOY</div></div>
<div class="cell"><div class="label">Wind</div><div class="value" id="windSpeed">—</div><div class="sub" id="windDirection">LIVE WEATHER</div></div>
<div class="cell"><div class="label">Tide</div><div class="value" id="tideHeight">—</div><div class="sub" id="tideTrend">NOAA PREDICTION</div></div>
<div class="cell"><div class="label">Conditions</div><div class="weathericon" id="weatherIcon">◌</div><div class="sub" id="weatherDescription">LOADING</div></div>
<div class="cell quality"><div class="label">Surf quality</div><div class="qualitybar"></div><div class="sub">CHECK LIVE CAM</div></div>
<div class="status" id="dataStatus" aria-live="polite">Loading live feeds</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=(v,d=0)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—';
function updateClock(){const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(now);$('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',weekday:'short',month:'short',day:'2-digit',year:'numeric'}).format(now).toUpperCase();}
updateClock();setInterval(updateClock,1000);
const compass=d=>{if(!Number.isFinite(Number(d)))return 'DIRECTION N/A';const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return dirs[Math.round(Number(d)/22.5)%16]+' · '+Math.round(Number(d))+'°';};
async function loadWeather(){
 const url='https://api.open-meteo.com/v1/forecast?latitude=33.5935&longitude=-117.8817&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m&temperature_unit=fahrenheit&wind_speed_unit=kn&timezone=America%2FLos_Angeles';
 const r=await fetch(url);if(!r.ok)throw Error('Weather unavailable');const j=await r.json(),v=j.current;
 $('temperature').textContent=fmt(v.temperature_2m)+'°F';$('temperatureC').textContent=fmt((v.temperature_2m-32)*5/9,1)+'°C · LIVE';
 $('windSpeed').textContent='↖ '+fmt(v.wind_speed_10m)+' kt';$('windDirection').textContent=compass(v.wind_direction_10m);
 const codes={0:['☀️','CLEAR'],1:['🌤️','MOSTLY CLEAR'],2:['🌤️','PARTLY CLOUDY'],3:['☁️','OVERCAST'],45:['🌫️','FOG'],48:['🌫️','FOG'],51:['🌦️','DRIZZLE'],53:['🌦️','DRIZZLE'],55:['🌧️','HEAVY DRIZZLE'],61:['🌧️','LIGHT RAIN'],63:['🌧️','RAIN'],65:['🌧️','HEAVY RAIN'],80:['🌦️','SHOWERS'],81:['🌧️','SHOWERS'],82:['⛈️','HEAVY SHOWERS'],95:['⛈️','THUNDERSTORM'],96:['⛈️','THUNDERSTORM'],99:['⛈️','THUNDERSTORM']};
 const w=codes[v.weather_code]||['🌤️','CURRENT CONDITIONS'];$('weatherIcon').textContent=w[0];$('weatherDescription').textContent=w[1];
}
async function loadBuoy(){
 const r=await fetch('https://www.ndbc.noaa.gov/data/realtime2/46253.txt');if(!r.ok)throw Error('Buoy unavailable');const lines=(await r.text()).trim().split(/\r?\n/),header=lines.find(x=>x.startsWith('#YY'));if(!header)throw Error('Buoy data unavailable');
 const cols=header.replace(/^#\s*/,'').trim().split(/\s+/),row=lines.slice(lines.indexOf(header)+1).find(x=>x.trim()&&!x.startsWith('#'));if(!row)throw Error('No buoy reading');
 const vals=row.trim().split(/\s+/),v={};cols.forEach((k,i)=>v[k]=vals[i]);const wave=Number(v.WVHT),period=Number(v.DPD);
 $('waveHeight').textContent=Number.isFinite(wave)&&wave>=0?fmt(wave*3.28084,1)+' ft':'N/A';
 $('wavePeriod').textContent=Number.isFinite(period)&&period>0?fmt(period)+' s period · NOAA':'PERIOD UNAVAILABLE';
}
async function loadTide(){
 const now=new Date(),parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit',timeZoneName:'shortOffset'}).formatToParts(now),get=t=>parts.find(p=>p.type===t)?.value;
 const date=get('year')+get('month')+get('day'),offset=get('timeZoneName')==='GMT-8'?'-08:00':'-07:00';
 const url='https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?station=9410580&product=predictions&date='+date+'&datum=MLLW&time_zone=lst_ldt&units=english&format=json&interval=60';
 const r=await fetch(url);if(!r.ok)throw Error('Tide unavailable');const j=await r.json();if(!j.predictions?.length)throw Error('Tide predictions unavailable');
 const a=j.predictions.map(p=>({...p,t:new Date(p.t.replace(' ','T')+offset)})),i=Math.max(0,a.findIndex(p=>p.t>=now)),p=a[i<0?a.length-1:i],prev=a[Math.max(0,(i<0?a.length-1:i)-1)];
 $('tideHeight').textContent=fmt(p.v,1)+' ft';$('tideTrend').textContent=(Number(p.v)>=Number(prev.v)?'RISING':'FALLING')+' · PREDICTED';
}
async function refresh(){const res=await Promise.allSettled([loadWeather(),loadBuoy(),loadTide()]);$('dataStatus').textContent=res.every(x=>x.status==='fulfilled')?'Live feeds updated':'One or more live feeds unavailable';}
refresh();setInterval(refresh,300000);
</script>
</body>
</html>
