<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08131d">
<meta name="description" content="Live news headlines about El Niño, California coastal impacts, and Newport Beach.">
<title>El Niño & Newport Beach News</title>
<style>
:root{color-scheme:dark;--ink:#f5f8fa;--muted:#9eafbc;--line:rgba(222,237,247,.14);--gold:#ffbd67}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.newsbar{width:100%;display:grid;grid-template-columns:190px minmax(0,1fr) minmax(0,1fr);align-items:stretch;overflow:hidden;border:1px solid rgba(203,225,239,.18);border-radius:10px;background:linear-gradient(110deg,rgba(7,20,31,.98),rgba(9,31,43,.96));box-shadow:0 6px 20px rgba(0,0,0,.16)}
.heading{padding:12px 15px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line)}
.kicker{font-size:9px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.title{font-size:14px;font-weight:800;letter-spacing:.035em;margin-top:5px}
.updated{font-size:9px;color:var(--muted);margin-top:6px}
.story{min-width:0;padding:11px 15px;display:flex;flex-direction:column;justify-content:center;gap:5px;border-right:1px solid var(--line);text-decoration:none;color:var(--ink)}
.story:last-child{border-right:0}.story:hover{background:rgba(255,255,255,.045)}
.category{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9eafbc}
.headline{font-size:12px;line-height:1.35;font-weight:650}
.source{font-size:9px;color:var(--muted)}
@media(max-width:700px){.newsbar{grid-template-columns:1fr}.heading{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}.story{padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.story:last-child{border-bottom:0}.title{font-size:12px}}
</style>
</head>
<body>
<section class="newsbar" aria-label="El Niño and Newport Beach news headlines">
<div class="heading"><div class="kicker">Coastal News</div><div class="title">EL NIÑO WATCH</div><div class="updated" id="updated">HEADLINES LOADING</div></div>
<a class="story" id="elnino" href="https://news.google.com/search?q=El%20Ni%C3%B1o%20California%20coast" target="_blank" rel="noopener noreferrer"><span class="category">EL NIÑO · CALIFORNIA</span><span class="headline">Latest reporting on El Niño and California coastal impacts</span><span class="source">SEARCH LATEST STORIES ↗</span></a>
<a class="story" id="newport" href="https://news.google.com/search?q=Newport%20Beach%20El%20Ni%C3%B1o%20coastal%20flooding" target="_blank" rel="noopener noreferrer"><span class="category">NEWPORT BEACH</span><span class="headline">Latest local headlines on coastal flooding, high tides and weather</span><span class="source">SEARCH LATEST STORIES ↗</span></a>
</section>
<script>
const feeds=[
 {id:'elnino',query:'El Nino California coast'},
 {id:'newport',query:'Newport Beach El Nino coastal flooding'}
];
async function updateHeadlines(){
 const results=await Promise.allSettled(feeds.map(async f=>{
  const rss='https://news.google.com/rss/search?q='+encodeURIComponent(f.query)+'&hl=en-US&gl=US&ceid=US:en';
  const url='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss);
  const r=await fetch(url);if(!r.ok)throw Error('Feed unavailable');const data=await r.json();
  const item=(data.items||[]).find(x=>x.title&&x.link);if(!item)throw Error('No story found');
  const a=document.getElementById(f.id);a.href=item.link;
  a.querySelector('.headline').textContent=item.title;
  a.querySelector('.source').textContent=(item.author||'LATEST NEWS')+' · OPEN STORY ↗';
 }));
 document.getElementById('updated').textContent=results.some(x=>x.status==='fulfilled')?'HEADLINES · REFRESHES EVERY 15 MIN':'NEWS FEED UNAVAILABLE · CLICK TO SEARCH';
}
updateHeadlines();setInterval(updateHeadlines,900000);
</script>
</body>
</html>
